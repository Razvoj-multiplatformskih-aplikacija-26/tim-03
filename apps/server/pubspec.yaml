name: server
description: Pet care center HTTP server on Relic and PostgreSQL that runs the same domain rules as the clients.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  api_contract:
    path: ../../packages/api_contract
  domain:
    path: ../../packages/domain
  hashlib: 2.4.2
  pool: 1.5.3
  postgres: 3.5.18
  relic: 1.2.0
  use_cases:
    path: ../../packages/use_cases
