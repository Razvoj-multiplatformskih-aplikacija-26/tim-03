name: backoffice
description: Pet care center backoffice for staff, on the desktop and in the browser.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  blocs:
    path: ../../packages/blocs
  domain:
    path: ../../packages/domain
  flutter_bloc: 9.1.1
  go_router: 18.0.2
  ui:
    path: ../../packages/ui
  use_cases:
    path: ../../packages/use_cases

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
