name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test shared packages on the VM and in Chrome
        run: |
          for package in packages/*/; do
            echo "::group::${package}"
            (cd "${package}" && dart test -p vm,chrome)
            echo "::endgroup::"
          done

      - name: Test apps
        run: |
          for app in apps/*/; do
            echo "::group::${app}"
            (cd "${app}" && flutter test)
            echo "::endgroup::"
          done
